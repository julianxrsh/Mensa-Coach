name: Speiseplan aktualisieren

on:
  schedule:
    - cron: '7 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install --break-system-packages requests beautifulsoup4

      - name: Speiseplan abrufen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python mensa.py

      - name: Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Speiseplan aktualisiert $(date -u +'%Y-%m-%d')"
          git push
